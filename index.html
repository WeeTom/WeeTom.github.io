<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nocoly 跳转测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        .container {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 90%;
            width: 300px;
        }
        h1 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 16px;
            transition: background-color 0.2s;
            word-break: break-all;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .url-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #666;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nocoly 跳转测试</h1>
        <a id="target-link" href="#" class="btn">点击打开</a>
        <div id="url-display" class="url-text">正在加载链接...</div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 获取 URL 参数中的 appscheme
            const urlParams = new URLSearchParams(window.location.search);
            // 如果没有提供 appscheme，默认使用 'mingdao'
            const appScheme = urlParams.get('appscheme') || 'mingdao';
            
            // 构建目标 URL
            const targetUrl = `${appScheme}://callbackurl=https://www.baidu.com?code=12345`;
            
            // 更新 DOM
            const linkElement = document.getElementById('target-link');
            const textElement = document.getElementById('url-display');
            
            if (linkElement) {
                linkElement.href = targetUrl;
            }
            if (textElement) {
                textElement.textContent = targetUrl;
            }

            // 3秒后自动跳转
            setTimeout(function() {
                window.location.href = targetUrl;
            }, 3000);
        });
    </script>
</body>
</html>
