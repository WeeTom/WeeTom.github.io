<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 PWA 应用</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#4A90E2">
</head>
<body>
    <header>
        <h1>PWA 示例</h1>
    </header>
    <main>
        <p>这是一个简单的渐进式 Web 应用 (PWA)。</p>
        
        <!-- 安装按钮区域 -->
        <div class="install-area">
            <button id="installBtn" class="primary-btn">下载/安装应用到桌面</button>
            <p id="installTip" class="tip">检测中...</p>
        </div>

        <div class="card">
            <h2>内容区域</h2>
            <p>这里是一些示例内容。当你离线时，这个页面应该仍然可以访问。</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2024 PWA Test</p>
    </footer>

    <script>
        // 注册 Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('Service Worker 注册成功:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Service Worker 注册失败:', error);
                    });
            });
        }

        // 处理安装提示
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const installTip = document.getElementById('installTip');

        // 检查是否已安装（简单的检查方式）
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches;
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

        if (isStandalone) {
            installTip.textContent = '已安装在桌面模式运行';
            installBtn.style.display = 'none';
        } else if (isSafari) {
            installTip.textContent = 'Safari 浏览器请在菜单栏选择 "文件" -> "添加到程序坞"';
            // Safari 不支持按钮触发安装，隐藏按钮或禁用
            installBtn.textContent = 'Safari 请手动安装';
            installBtn.disabled = true;
            installBtn.style.backgroundColor = '#ccc';
            installBtn.style.cursor = 'default';
        } else {
            installTip.textContent = '如果按钮无效，请检查浏览器地址栏安装图标';
        }

        window.addEventListener('beforeinstallprompt', (e) => {
            // 防止 Chrome 67 及更早版本自动显示安装提示
            e.preventDefault();
            // 保存事件以便稍后触发
            deferredPrompt = e;
            // 更新 UI
            installBtn.style.display = 'block';
            installTip.textContent = '点击上方按钮安装应用到设备';
            console.log('可以安装 PWA');
        });

        installBtn.addEventListener('click', (e) => {
            if (deferredPrompt) {
                // 隐藏安装提示
                installTip.textContent = '正在安装...';
                // 显示安装提示
                deferredPrompt.prompt();
                // 等待用户响应
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('用户接受了安装请求');
                        installTip.textContent = '应用已安装';
                        installBtn.style.display = 'none';
                    } else {
                        console.log('用户拒绝了安装请求');
                        installTip.textContent = '用户取消了安装';
                    }
                    deferredPrompt = null;
                });
            } else if (isSafari) {
                alert('Safari 浏览器不支持按钮安装。\n\n请在顶部菜单栏选择：\n"文件" (File) -> "添加到程序坞" (Add to Dock)');
            } else {
                // 如果没有触发 beforeinstallprompt（例如非 HTTPS/Localhost，或已安装）
                alert('无法自动触发安装。\n\n可能的原因：\n1. 已经在非 HTTPS 环境（如局域网 IP）访问。\n2. 浏览器不支持 PWA 安装。\n3. 应用已经安装。\n\n请尝试使用浏览器菜单中的"安装"或"添加到主屏幕"选项。');
            }
        });
    </script>
</body>
</html>
