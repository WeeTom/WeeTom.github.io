<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WeeTom - Service Worker 调试面板</title>
    <meta
      name="description"
      content="一个用于快速调试和验证 Service Worker 的简易面板。"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./main.js"></script>
  </head>
  <body>
    <header class="container header">
      <a class="brand" href="#" aria-label="返回首页">
        <span class="brand__dot" aria-hidden="true"></span>
        <span class="brand__text">WeeTom</span>
      </a>
    </header>

    <main class="container main">
      <section class="hero">
        <p class="pill">Service Worker • Dev Tools</p>
        <h1>Service Worker 调试面板</h1>
        <p class="muted">用于本地快速验证注册、缓存、离线兜底等行为。</p>
        <div class="hero__actions">
          <button class="btn btn--primary" id="registerBtn">注册/刷新 SW</button>
          <button class="btn btn--ghost" id="unregisterBtn">注销 SW</button>
          <button class="btn" id="clearCacheBtn">清空缓存</button>
          <a
            class="btn"
            id="openMingdaoBtn"
            href="mingdao://nfc/https://www.mingdao.com/app/8225f0be-12b0-4c6d-be16-732655129424/newrecord/687da3dc303ab4c477df9005/687da3dc303ab4c477df9009?sn=1"
            >打开明道链接</a
          >
        </div>
      </section>

      <section id="panels" class="grid">
        <article class="card panel">
          <div class="panel__header">
            <h2>运行状态</h2>
            <button class="btn btn--ghost" id="checkStatusBtn">刷新状态</button>
          </div>
          <div class="status">
            <span class="status__dot" id="swDot" aria-hidden="true"></span>
            <div class="status__text">
              <strong id="swState">未知</strong>
              <p class="muted" id="swDetail">等待获取注册信息...</p>
            </div>
          </div>
          <div class="grid grid--two">
            <div>
              <p class="muted label">作用域</p>
              <p id="swScope">--</p>
            </div>
            <div>
              <p class="muted label">版本缓存</p>
              <p id="cacheNames">--</p>
            </div>
          </div>
        </article>

        <article class="card panel">
          <div class="panel__header">
            <h2>缓存与请求</h2>
            <div class="panel__actions">
              <button class="btn btn--ghost" id="listCacheBtn">列出缓存</button>
              <button class="btn" id="fetchTestBtn">测试请求</button>
            </div>
          </div>
          <ul class="list" id="cacheList" aria-live="polite">
            <li class="muted">点击“列出缓存”以查看当前缓存键</li>
          </ul>
          <p class="muted small">提示：在浏览器 DevTools → Application → Service Workers 面板可进一步查看。</p>
        </article>
      </section>

      <section class="about">
        <h2>日志</h2>
        <pre class="log" id="log" aria-live="polite">等待事件...</pre>
      </section>
    </main>

    <footer class="container footer">
      <span class="muted">© <span id="year"></span> WeeTom</span>
      <span class="muted">Service Worker 调试面板</span>
    </footer>
  </body>
</html>
